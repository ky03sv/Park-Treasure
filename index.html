<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パークトレジャー 所持チェックリスト</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e9ecf8;background:#101323}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:28px 18px 70px}h1{font-size:clamp(23px,4vw,34px);margin:0 0 6px}.sub{color:#aeb6cf;margin:0 0 24px}.panel{background:#1b2035;border:1px solid #303954;border-radius:17px;padding:18px;margin-bottom:17px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#252c45;border-radius:12px;padding:13px}.stat b{font-size:23px;display:block;margin:5px 0}.muted{color:#aeb6cf;font-size:13px}.bar{height:9px;background:#38425c;border-radius:10px;overflow:hidden;margin-top:9px}.fill{height:100%;background:linear-gradient(90deg,#8c7afa,#4ad6c3);width:0;transition:width .2s}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input[type=search],select,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #465171;background:#252d47;color:#fff}input[type=search]{flex:1;min-width:190px}button{cursor:pointer}button:hover{background:#374368}.primary{background:#6758d8;border-color:#8172ef}#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}.item{display:flex;align-items:center;gap:12px;border:1px solid #35405e;border-radius:11px;padding:12px;background:#202740;cursor:pointer;min-height:55px}.item:has(input:checked){background:#273c46;border-color:#4caa9b}.item input{accent-color:#64dfc3;width:19px;height:19px;flex:none}.item span{font-size:14px;line-height:1.5;overflow-wrap:anywhere}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.sectionhead h2{margin:0;font-size:18px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}#empty{padding:24px;text-align:center;color:#aeb6cf}.foot{font-size:12px;color:#9ca8c3;margin-top:20px}input[type=file]{display:none}</style></head><body><main><h1>パークトレジャー 所持チェックリスト</h1><p class="sub">アバターアイテムの所持状況を管理・集計</p><section class="panel"><div class="sectionhead"><h2>全体の所持状況</h2><span id="totalPercent"></span></div><div id="totalText" class="muted"></div><div class="bar"><div id="totalBar" class="fill"></div></div></section><section class="panel"><div class="sectionhead"><h2>種別ごとの所持率</h2></div><div id="stats" class="stats"></div></section><section class="panel"><div class="controls"><input id="search" type="search" placeholder="アイテム名で検索"><select id="category"><option value="">すべての種別</option></select><select id="status"><option value="all">すべて表示</option><option value="missing">未所持のみ</option><option value="owned">所持済みのみ</option></select></div><div class="actions"><button id="export">JSONエクスポート</button><button id="import">JSONインポート</button><input id="file" type="file" accept=".json,application/json"><button id="reset">チェックをすべて解除</button></div></section><section class="panel"><div class="sectionhead"><h2>アイテム一覧</h2><span id="shown" class="muted"></span></div><div id="items"></div><div id="empty" hidden>条件に一致するアイテムがありません。</div></section><p class="foot">所持状況はこのブラウザ内に保存されます。別の端末へ移す場合はJSONのエクスポート・インポートをご利用ください。</p></main><script>
const groups={
'トップス':[`『ホーリーファルコン』ワイシャツ`,`『フェアリー』ブラウス`,`『クレイゴーレム』パーカー`,...seq('バンキッシュフードパーカー',5),...seq('フレイムウィンドブレーカー',6),...seq('サイバーウィンドブレーカー',5),`『フォレストバット』ウィンドブレーカー`,`『ゴブリンTシャツ』`,...classes('Tシャツ')],
'ボトムス':[`『フェアリー』ミニスカート`,...seq('フェイクファースカート',5),`『フォレストバット』ジャージパンツ`,`『クレイゴーレム』パンツ`,...classes('ジャージパンツ'),...seq('サイバークロップドパンツ',5),...seq('バンキッシュクロップドパンツ',5),`『ホーリーファルコン』クロップドパンツ`,`『ゴブリン』ショートパンツ`],
'ソックス':[...seq('フリルトリムソックス',7),...seq('パターンソックス',5),...seq('ストライプオーバーニーソックス',7),...seq('サイバーオーバーニーソックス',5),...seq('ファンシーオーバーニーソックス',5),...seq('アスリートタイツ',5)],
'シューズ':[...seq('サイバーブーツ',5),...seq('フローラルブーツ',5),`『クレイゴーレム』ブーツ`,`『フェアリー』パンプス`,...seq('フェイクレザーローファー',5),`『ホーリーファルコン』ローファー`,...seq('ネオンスニーカー',5),...seq('バンキッシュスニーカー',5),...classes('スニーカー'),`『フォレストバット』スニーカー`,`『ゴブリン』スニーカー`],
'スマホ':[...seq('メタリックスマホ',2),...seq('メタリックうさ耳スマホ',2),'パンダ柄うさ耳スマホ','パンダ柄うさ耳スマホ（ブラウン）','ブチ柄うさ耳スマホ','ツートーンうさ耳スマホ','ライラックうさ耳スマホ',...seq('メタリックねこ耳スマホ',2),'ミケ柄ねこ耳スマホ','サバトラ柄ねこ耳スマホ','トラ柄ねこ耳スマホ','ハチワレ柄ねこ耳スマホ','ツートーンねこ耳スマホ','ショートケーキスマホ','板チョコスマホ','ベーコンエッグスマホ','スイカスマホ'],
'メガネ':[...seq('トータスリムグラス',5),...seq('パーティグラス',5),...seq('トータスハーフリムグラス',5),...seq('瓶底メガネ',7),...seq('ぐるぐるメガネ',7)]};
function seq(name,n){return Array.from({length:n},(_,i)=>name+(i+1))}function classes(s){return ['エルフ','ロイヤル','ウィッチ','ドラゴン','ナイトメア','ビショップ','ネメシス'].map(x=>x+s)}
const data=Object.entries(groups).flatMap(([category,names])=>names.map(name=>({category,name,id:category+'::'+name})));const KEY='park-treasure-owned-v1';let owned=new Set();try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))owned=new Set(stored.filter(x=>data.some(d=>d.id===x)))}catch(e){}const $=id=>document.getElementById(id);const category=$('category');Object.keys(groups).forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;category.append(o)});function save(){try{localStorage.setItem(KEY,JSON.stringify([...owned]))}catch(e){alert('ブラウザへの保存に失敗しました。JSONでバックアップしてください。')}}function render(){const count=data.filter(d=>owned.has(d.id)).length,pct=data.length?count/data.length*100:0;$('totalPercent').textContent=pct.toFixed(1)+'%';$('totalText').textContent=count+' / '+data.length+' アイテム所持';$('totalBar').style.width=pct+'%';$('stats').replaceChildren();for(const [cat,names] of Object.entries(groups)){const n=data.filter(d=>d.category===cat&&owned.has(d.id)).length,p=n/names.length*100;const box=document.createElement('div');box.className='stat';const t=document.createElement('div');t.className='muted';t.textContent=cat;const b=document.createElement('b');b.textContent=p.toFixed(1)+'%';const small=document.createElement('div');small.className='muted';small.textContent=n+' / '+names.length;const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=p+'%';bar.append(fill);box.append(t,b,small,bar);$('stats').append(box)}const q=$('search').value.trim().toLocaleLowerCase(),cat=category.value,status=$('status').value;const filtered=data.filter(d=>(!cat||d.category===cat)&&d.name.toLocaleLowerCase().includes(q)&&(status==='all'||(status==='owned'?owned.has(d.id):!owned.has(d.id))));$('shown').textContent=filtered.length+' / '+data.length+' 件表示';$('empty').hidden=filtered.length>0;const frag=document.createDocumentFragment();for(const d of filtered){const label=document.createElement('label');label.className='item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=owned.has(d.id);cb.addEventListener('change',()=>{cb.checked?owned.add(d.id):owned.delete(d.id);save();render()});const text=document.createElement('span');text.textContent=d.name;label.append(cb,text);frag.append(label)}$('items').replaceChildren(frag)}$('search').addEventListener('input',render);category.addEventListener('change',render);$('status').addEventListener('change',render);$('reset').onclick=()=>{if(confirm('すべての所持チェックを解除しますか？')){owned.clear();save();render()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),owned:[...owned]},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='park_treasure_owned.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.owned))throw Error('形式が正しくありません');const valid=new Set(data.map(d=>d.id));const next=new Set(obj.owned.filter(id=>valid.has(id)));if(confirm('現在の所持データを、読み込んだ '+next.size+' 件で置き換えますか？')){owned=next;save();render()}}catch(err){alert('読み込みに失敗しました: '+err.message)}e.target.value=''};render();
</script></body></html>
